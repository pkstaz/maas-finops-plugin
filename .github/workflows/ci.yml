name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests and linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

  test-bff:
    runs-on: ubuntu-latest
    name: Run BFF tests
    defaults:
      run:
        working-directory: bff
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...
